# ==========================================
# CẤU HÌNH REDIS TÙY CHỈNH
# ==========================================

# Lắng nghe trên tất cả các interface
bind 0.0.0.0

# Port mặc định Redis
port 6379

# Đặt mật khẩu bảo vệ Redis
requirepass mypassword123

# Giới hạn bộ nhớ tối đa
maxmemory 256mb

# Chiến lược khi đầy bộ nhớ
# allkeys-lru: xóa key ít dùng nhất
maxmemory-policy allkeys-lru

# Lưu dữ liệu xuống disk (backup)
# save <seconds> <changes>
save 900 1    # 900 giây nếu có 1 thay đổi
save 300 10   # 300 giây nếu có 10 thay đổi
save 60  10000 # 60 giây nếu có 10000 thay đổi

# Tên file backup
dbfilename dump.rdb

# Thư mục lưu file backup
dir /data

# Số databases (mặc định 16)
databases 16

# Timeout kết nối (0 = không timeout)
timeout 300

# Log level: debug, verbose, notice, warning
loglevel notice

# Tên file log (để trống = stdout)
logfile ""