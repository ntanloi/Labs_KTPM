<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sách mới - Hệ thống quản lý thư viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            border-radius: 10px;
            margin: 5px 0;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: white;
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
        }
        .form-control, .form-select {
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white"><i class="fas fa-book"></i> Thư viện</h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="/">
                                <i class="fas fa-home"></i> Trang chủ
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/books">
                                <i class="fas fa-book-open"></i> Danh sách sách
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/books/add">
                                <i class="fas fa-plus"></i> Thêm sách mới
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/search">
                                <i class="fas fa-search"></i> Tìm kiếm sách
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/overdue">
                                <i class="fas fa-exclamation-triangle"></i> Sách quá hạn
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="pt-3 pb-2 mb-3">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                        <h1 class="h2"><i class="fas fa-plus"></i> Thêm sách mới</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <a href="/books" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Quay lại
                            </a>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-industry"></i> Factory Method Pattern - Tạo sách theo loại</h5>
                        </div>
                        <div class="card-body">
                            <form action="/books/add" method="post">
                                <!-- Thông tin chung -->
                                <div class="row mb-4">
                                    <div class="col-12">
                                        <h6 class="text-primary">Thông tin cơ bản</h6>
                                        <hr>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="bookType" class="form-label">Loại sách *</label>
                                        <select class="form-select" id="bookType" name="bookType" required onchange="toggleSpecificFields()">
                                            <option value="">Chọn loại sách</option>
                                            <option value="PHYSICAL">Sách giấy</option>
                                            <option value="EBOOK">Sách điện tử</option>
                                            <option value="AUDIOBOOK">Sách nói</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="title" class="form-label">Tên sách *</label>
                                        <input type="text" class="form-control" id="title" name="title" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="author" class="form-label">Tác giả *</label>
                                        <input type="text" class="form-control" id="author" name="author" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="genre" class="form-label">Thể loại *</label>
                                        <input type="text" class="form-control" id="genre" name="genre" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="publicationDate" class="form-label">Ngày xuất bản *</label>
                                        <input type="date" class="form-control" id="publicationDate" name="publicationDate" required>
                                    </div>
                                </div>

                                <!-- Thông tin riêng cho sách giấy -->
                                <div id="physicalBookFields" class="row mb-4" style="display: none;">
                                    <div class="col-12">
                                        <h6 class="text-success">Thông tin sách giấy</h6>
                                        <hr>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="isbn" class="form-label">ISBN</label>
                                        <input type="text" class="form-control" id="isbn" name="isbn">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="pageCount" class="form-label">Số trang</label>
                                        <input type="number" class="form-control" id="pageCount" name="pageCount" min="1">
                                    </div>
                                </div>

                                <!-- Thông tin riêng cho sách điện tử -->
                                <div id="ebookFields" class="row mb-4" style="display: none;">
                                    <div class="col-12">
                                        <h6 class="text-info">Thông tin sách điện tử</h6>
                                        <hr>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="fileFormat" class="form-label">Định dạng file</label>
                                        <select class="form-select" id="fileFormat" name="fileFormat">
                                            <option value="">Chọn định dạng</option>
                                            <option value="PDF">PDF</option>
                                            <option value="EPUB">EPUB</option>
                                            <option value="MOBI">MOBI</option>
                                            <option value="AZW">AZW</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="fileSizeMB" class="form-label">Kích thước file (MB)</label>
                                        <input type="number" class="form-control" id="fileSizeMB" name="fileSizeMB" min="0" step="0.1">
                                    </div>
                                </div>

                                <!-- Thông tin riêng cho sách nói -->
                                <div id="audiobookFields" class="row mb-4" style="display: none;">
                                    <div class="col-12">
                                        <h6 class="text-warning">Thông tin sách nói</h6>
                                        <hr>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="durationMinutes" class="form-label">Thời lượng (phút)</label>
                                        <input type="number" class="form-control" id="durationMinutes" name="durationMinutes" min="1">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="narrator" class="form-label">Người đọc</label>
                                        <input type="text" class="form-control" id="narrator" name="narrator">
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-primary me-2">
                                            <i class="fas fa-save"></i> Thêm sách
                                        </button>
                                        <a href="/books" class="btn btn-secondary">
                                            <i class="fas fa-times"></i> Hủy
                                        </a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSpecificFields() {
            const bookType = document.getElementById('bookType').value;
            const physicalFields = document.getElementById('physicalBookFields');
            const ebookFields = document.getElementById('ebookFields');
            const audiobookFields = document.getElementById('audiobookFields');
            
            // Hide all specific fields
            physicalFields.style.display = 'none';
            ebookFields.style.display = 'none';
            audiobookFields.style.display = 'none';
            
            // Show relevant fields based on book type
            switch(bookType) {
                case 'PHYSICAL':
                    physicalFields.style.display = 'block';
                    break;
                case 'EBOOK':
                    ebookFields.style.display = 'block';
                    break;
                case 'AUDIOBOOK':
                    audiobookFields.style.display = 'block';
                    break;
            }
        }
    </script>
</body>
</html>
